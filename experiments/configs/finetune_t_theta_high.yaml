# Same setup as finetune.yaml (rerun of 7hnur00g), but with the θ-time
# schedule pushed toward HIGH t (less noise on θ) instead of uniform:
#   κ: logit-normal(-0.8, 0.8) — unchanged, low-t emphasis on the field side.
#   θ: logit-normal(+0.8, 0.8) — symmetric mirror of κ, biases θ training
#                                 toward the low-noise regime where cosmology
#                                 inference happens at sampling time.
# Designed for `python train_sharding.py --config configs/finetune_t_theta_high.yaml`.
# Plain attention (no QKV split — train_sharding.py constructs JADE_B_16
# without the split_qkv flag), every parameter trainable, but the schedule
# (1e-4 → 1e-5 linear) refines the existing solution without overwriting it.

model:
  # "hybrid" (validated nn_hybrid.JADE_B_16) or
  # "hybrid_summary" (nn_hybrid_summary.JADE_B_16 with cond-summary head).
  arch: "hybrid"
  name: "JADE_B_16"
  in_channels: 5
  input_size: 128
  enable_cond_image: true
  cond_channels: 5
  patch_size: 8
  cond_patch_size: 8
  num_cosmo_tokens: 16
  cond_start: 0
  attn_drop: 0.0
  proj_drop: 0.0

training:
  num_epochs: 500
  batch_size: 128
  seed: 42
  use_mixed_precision: true
  precision: "bfloat16"

distributed:
  use_sharding: true

# Linear from 1e-4 → 1e-5 across the whole run.
optimizer:
  type: "adamw"
  learning_rate: 1e-5
  weight_decay: 0.
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  use_schedule: true
  schedule:
    init_value: 1e-4
    end_value: 1e-5

ema:
  use_ema: true
  decay: 0.9996

diffusion:
  model: "linear"
  time_distribution: "logit"
  # Fallback (single-t) μ/σ — irrelevant here since per-modality is active
  # via mu_kappa/sigma_kappa + mu_theta/sigma_theta.
  mu: -0.8
  sigma: 0.8
  t_eps: 0.05
  # κ schedule: standard low-t-emphasis logit-normal, no mixture aux.
  mu_kappa: -0.8
  sigma_kappa: 0.8
  # θ schedule: logit-normal with positive mean → biased toward HIGH t (low
  # noise on cosmology). Symmetric mirror of κ; E[t_θ] ≈ sigmoid(+0.8) ≈ 0.69.
  theta_distribution: "logit_normal"
  mu_theta: 0.8
  sigma_theta: 0.8

data:
  dataset_path: "sbi_lens_full"
  val_split: 0.05
  shuffle_seed: 42
  num_workers: 8

checkpoint:
  dir: "checkpoints"
  save_every_n_epochs: 1
  keep_best: true
  # Persist a numbered EMA snapshot each time plots are pushed to W&B
  # (visualize_every_n_epochs), so every reviewable epoch has a recoverable
  # checkpoint instead of only the rolling "latest".
  snapshot_every_n_epochs: 10

logging:
  project: "jade"
  entity: "b-remy"
  log_every_n_steps: 10
  visualize_every_n_epochs: 10
  mcmc_ref_dir: "mcmc_log_normal"

loss:
  type: "v-loss"
  mixture: false
  lambda_cosmo: 10.
  SCALE_COSMO: 1

# Resume from stage-1 checkpoint.
start_from_checkpoint: true
params_path: "/u/bremy/repos/jade/experiments/wandb/run-20260414_232810-e06v6sdj/files/checkpoints"
lap: 0
