# Model configuration
model:
  name: "JADE_B_16_VE"
  in_channels: 5
  input_size: 128

# Training configuration
training:
  num_epochs: 512
  batch_size: 512
  seed: 42
  use_mixed_precision: true
  precision: "bfloat16"

# Optimizer configuration
optimizer:
  type: "adamw"
  learning_rate: 5e-4
  weight_decay: 1e-4
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  
  use_schedule: false
  schedule:
    init_value: 1e-6
    peak_value: 1e-4
    warmup_steps: 1000
    end_value: 1e-5

# EMA configuration
ema:
  use_ema: true
  decay: 0.999

# Diffusion configuration - VARIANCE EXPLODING MODE
diffusion:
  mode: "variance_exploding"  # Enable VE diffusion: xt = x + sigma_t * z
  
  # Noise schedule parameters (geometric interpolation)
  sigma_min: 0.01   # Minimum noise level at t=0
  sigma_max: 50.0   # Maximum noise level at t=1
  
  # Time distribution - keep your logit distribution
  time_distribution: "logit"  # Options: "logit", "beta", "uniform"
  mu: -0.8
  sigma: 0.8
  
  # Alternative time distributions (if you want to try):
  # time_distribution: "beta"
  # beta_a: 3.0
  # beta_b: 3.0
  
  # Loss weighting function
  # "inverse_sigma_squared_plus_one" gives w(t) = 1/sigma(t)^2 + 1
  # "uniform" gives w(t) = 1.0
  weight_type: "inverse_sigma_squared_plus_one"

# Data configuration
data:
  dataset_path: "sbi_lens_lognormal"
  val_split: 0.1
  shuffle_seed: 42

# Checkpoint configuration
checkpoint:
  dir: "checkpoints"
  save_every_n_epochs: 10
  keep_best: true

# Logging configuration
logging:
  project: "jade"
  entity: "b-remy"
  log_every_n_steps: 10
  visualize_every_n_epochs: 10

# Loss configuration - VARIANCE EXPLODING LOSSES
loss:
  type: "x-loss"  # Options for VE: "x-loss" (denoise to x_0), "eps-loss" (predict noise)
  lambda_cosmo: 1.0

# Notes:
# - VE mode uses: xt = x + sigma(t) * z, where sigma(t) = sigma_min * (sigma_max/sigma_min)^t
# - "x-loss": Model predicts clean data x_0 directly (denoising objective)
# - "eps-loss": Model predicts the noise epsilon (noise prediction objective)
# - Loss is weighted by weight_type function to balance contributions across noise levels
# - The logit time distribution with mu=-0.8, sigma=0.8 will bias sampling toward lower t values
#   This can help with training stability in VE mode