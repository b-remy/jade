# Finetune the trained JADE model with a TARP-CvM calibration regularizer.
#   total_loss = flow_loss + calibration.lambda_tarp * tarp_cvm_loss
# The architecture / checkpoint pairing below matches finetune.yaml (run
# e06v6sdj). Override params_path / params_tag to start from a different model.

model:
  arch: hybrid
  name: JADE_B_16
  in_channels: 5
  input_size: 128
  enable_cond_image: true   # REQUIRED for calibration (need an observation to condition on)
  cond_channels: 5
  patch_size: 8
  cond_patch_size: 8
  num_cosmo_tokens: 16
  cond_start: 0
  attn_drop: 0.0
  proj_drop: 0.0

training:
  num_epochs: 500
  # 64, not the base model's 128: the flow loss alone already saturated GPU
  # memory at 128, and the TARP term needs room on top. Halving frees ~43GB.
  batch_size: 64
  seed: 42
  use_mixed_precision: true
  precision: bfloat16

distributed:
  use_sharding: true

optimizer:
  type: adamw
  learning_rate: 1.0e-05
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  use_schedule: true
  schedule:
    init_value: 1.0e-05
    end_value: 1.0e-05

ema:
  use_ema: true
  decay: 0.999

diffusion:
  model: linear
  time_distribution: logit
  mu: -0.8
  sigma: 0.8
  t_eps: 0.05
  mu_aux: 6.0
  sigma_aux: 0.5
  p_aux: 0.3

data:
  dataset_path: sbi_lens_full
  val_split: 0.05
  shuffle_seed: 42
  num_workers: 8

checkpoint:
  dir: checkpoints
  save_every_n_epochs: 1
  keep_best: true

logging:
  project: jade
  entity: b-remy
  log_every_n_steps: 10
  visualize_every_n_epochs: 10
  mcmc_ref_dir: mcmc_log_normal

loss:
  type: v-loss
  mixture: false
  lambda_cosmo: 10.0
  SCALE_COSMO: 1

# ---------------------------------------------------------------------------
# TARP-CvM calibration regularizer.
# Cost per calibrated step ~ n_cal * M * num_steps extra network evals (+ the
# adjoint backward). Use every_n_steps > 1 to amortize.
#
# MEMORY: peak scales as (n_cal * M) * per-draw activations -- measured at
# ~0.5GiB per draw for this model. 256 draws asked for 129GiB and OOM'd on a
# 96GB GH200; 64 draws is ~32GiB, which fits in the ~43GB freed by batch_size
# 128->64. Raising n_cal*M above ~64 needs gradient checkpointing in the ODE
# vector field (recompute activations in the backward) to be affordable.
# ---------------------------------------------------------------------------
calibration:
  enabled: true
  lambda_tarp: 1.0        # weight of the TARP term relative to the flow loss
  n_cal: 16               # observations used to build the CvM ECDF (<= batch_size)
  M: 4                    # posterior draws per observation (cut 16->4 to fit memory)
  R: 16                   # TARP reference points
  tau: 0.05               # sigmoid temperature for the soft indicator
  num_steps: 50           # diffrax Euler steps for the posterior sampler
  every_n_steps: 1        # apply the calibration term every N steps
  adjoint: backsolve      # backsolve (O(1) memory) | recursive | direct

# Start from the trained JADE checkpoint: run 7hnur00g, the same model
# evaluated in experiments/notebooks/plot_amortized.py. Its architecture matches
# the model block above (it was itself continued from e06v6sdj).
# params_tag `latest` (non-EMA) also matches plot_amortized.py; the ema_latest /
# best / ema_best tags are available in the same directory.
start_from_checkpoint: true
params_path: /u/bremy/repos/jade/experiments/wandb/run-20260507_170014-7hnur00g/files/checkpoints
params_tag: latest
lap: 0
